openapi: 3.1.0
info:
  title: NASA Omni Inventory API
  version: 0.1.0
  description: >
    Inventory Management System (diagram) — the only writer to Postgres. Consumers: dashboard (GET/POST/PATCH),
    perception reconciler (/ingest/*), agent (read tools), eval runner. Images are served via /media.
servers: [{url: http://inventory-api.nasa-app.svc:8080}]
paths:
  /healthz:
    get: {summary: Liveness + DB check, responses: {'200': {description: ok}}}

  /items:
    get:
      summary: List/search entities with filters (R7)
      parameters:
        - {name: q, in: query, schema: {type: string}, description: fuzzy match on label/description/catalog name}
        - {name: kind, in: query, schema: {enum: [object, person]}}
        - {name: status, in: query, schema: {type: array, items: {enum: [confirmed, provisional, unknown, merged, dismissed]}}, style: form, explode: true}
        - {name: catalog_id, in: query, schema: {type: string}}
        - {name: location, in: query, schema: {type: string}, description: location_id; matches the location and its descendants}
        - {name: min_confidence, in: query, schema: {type: number, minimum: 0, maximum: 1}}
        - {name: seen_after, in: query, schema: {type: string, format: date-time}}
        - {name: seen_before, in: query, schema: {type: string, format: date-time}}
        - {name: needs_review, in: query, schema: {type: boolean}}
        - {name: sort, in: query, schema: {enum: [last_seen_at, -last_seen_at, label, -label, confidence, -confidence], default: -last_seen_at}, description: 'label sorts case-insensitively (lower(label), then label, then entity_id) whatever the database collation (AC-API-36)'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: page, content: {application/json: {schema: {$ref: '#/components/schemas/ItemPage'}}}}
    post:
      summary: Operator adds an item not yet seen by the pipeline — IMAGE REQUIRED (R7)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, label, location_id]
              properties:
                image: {type: string, format: binary}
                label: {type: string}
                description: {type: string}
                catalog_id: {type: string}
                location_id: {type: string}
                kind: {enum: [object, person], default: object}
                operator: {type: string}
      responses:
        '201': {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/Item'}}}}
        '422': {description: missing image or invalid fields}

  /items/{entity_id}:
    parameters: [{name: entity_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Item detail with recent sightings and events
      responses:
        '200': {description: detail, content: {application/json: {schema: {$ref: '#/components/schemas/ItemDetail'}}}}
        '404': {description: not found}
    patch:
      summary: Operator edits an item changed off-screen (R7); audited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string}
                description: {type: string}
                catalog_id: {type: [string, 'null']}
                last_location: {type: string}
                status: {enum: [confirmed, provisional, unknown, dismissed]}
                attributes: {type: object}
                needs_review: {type: boolean}
                operator: {type: string}
                note: {type: string}
      responses:
        '200': {description: updated, content: {application/json: {schema: {$ref: '#/components/schemas/Item'}}}}
        '404': {description: not found}
        '409': {description: entity is merged}

  /items/{entity_id}/merge:
    post:
      summary: Merge this entity INTO another (dedup by operator); reversible via /audit
      parameters: [{name: entity_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [into_entity_id], properties: {into_entity_id: {type: string, format: uuid}, operator: {type: string}, note: {type: string}}}}}}
      responses: {'200': {description: merged}, '409': {description: invalid merge (self, already merged, kind mismatch)}}

  /items/{entity_id}/unmerge:
    post:
      summary: Undo the merge of this (merged, source) entity, restoring source and target from the merge audit detail (AC-API-33)
      parameters: [{name: entity_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [operator], properties: {operator: {type: string, minLength: 1}, note: {type: [string, 'null']}}}}}}
      responses:
        '200': {description: unmerged, content: {application/json: {schema: {$ref: '#/components/schemas/UnmergeResult'}}}}
        '404': {description: unknown entity}
        '409': {description: 'not merged; target merged again since; no merge audit with undo detail; or new target sightings match the source appearance'}
        '422': {description: missing operator or malformed id}

  /items/{entity_id}/history:
    get:
      summary: Timeline of sightings + events + audit for an item (AC-API-11, AC-API-32)
      parameters:
        - {name: entity_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 2000, default: 500}}
        - {name: collapse, in: query, schema: {type: boolean, default: true}, description: 'true (default) folds runs of >=2 consecutive routine pipeline update audits into one entry with count; false returns the raw audit rows'}
      responses: {'200': {description: timeline, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TimelineEntry'}}}}}}

  /review:
    get:
      summary: Review queue — unknown objects, possible duplicates, low confidence (R6)
      parameters:
        - {name: status, in: query, schema: {enum: [open, resolved, dismissed], default: open}}
        - {name: kind, in: query, schema: {enum: [unknown_object, possible_duplicate, low_confidence, conflict]}}
        - {name: location, in: query, schema: {type: string}, description: review location_id; matches the location and its descendants}
        - {name: q, in: query, schema: {type: string, maxLength: 200}, description: case-insensitive substring over description and entity label}
        - {name: sort, in: query, schema: {enum: [created_at, observed_at], default: created_at}}
        - {name: order, in: query, schema: {enum: [desc, asc], default: desc}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: queue (always a JSON array)
          headers: {X-Total-Count: {description: number of matching reviews before limit/offset, schema: {type: integer}}}
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ReviewItem'}}}}
        '422': {description: invalid filter value}
  /review/{review_id}:
    get:
      summary: One review item (same shape as the queue entries)
      parameters: [{name: review_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: review, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewItem'}}}}
        '404': {description: not found}
  /review/{review_id}/resolve:
    post:
      summary: NASA classifies a review item (R6)
      parameters: [{name: review_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, operator]
              properties:
                action: {enum: [assign_catalog, new_catalog, merge_into, dismiss]}
                catalog_id: {type: string, description: for assign_catalog}
                new_catalog: {$ref: '#/components/schemas/CatalogItem'}
                target_entity_id: {type: string, format: uuid, description: for merge_into}
                label: {type: string}
                operator: {type: string}
                note: {type: string}
      responses: {'200': {description: resolved}, '409': {description: already resolved}, '422': {description: invalid action payload}}

  /catalog:
    get: {summary: Closed-world catalog, responses: {'200': {description: list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CatalogItem'}}}}}}}
    post:
      summary: Add a catalog item
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogItem'}}}}
      responses: {'201': {description: created}, '409': {description: duplicate id}}
  /locations:
    get: {summary: Location hierarchy, responses: {'200': {description: list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Location'}}}}}}}
  /events:
    get:
      summary: Events (who moved what)
      parameters:
        - {name: entity_id, in: query, schema: {type: string, format: uuid}}
        - {name: type, in: query, schema: {type: string}}
        - {name: types, in: query, schema: {type: string}, description: 'comma-separated event types (e.g. moved,used,handed_over); ANDed with type; unknown type -> 422'}
        - {name: after, in: query, schema: {type: string, format: date-time}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses: {'200': {description: events, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Event'}}}}}}
  /search:
    get:
      summary: Full-text search over entities and observation windows (agent tool, memory tier 2 index)
      parameters: [{name: q, in: query, required: true, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, default: 20}}]
      responses:
        '200':
          description: 'hits, entity and window lists interleaved. Window hits are {type: window, id, snippet, time, camera_id, is_private}. Private windows (AC-API-39) are never returned, so is_private is always false'
  /stats:
    get:
      summary: 'Counts by status/location/kind, open review items, and windows {total, private} (AC-API-39)'
      responses: {'200': {description: 'stats: {windows: {total, private}, by_status, by_kind, by_module, by_location_level, open_reviews_by_kind}. by_module also has segment keys (USOS, ROS) for live items located only at segment level (perception could not place them inside a module); by_location_level = {module, segment, unknown} adds up to the live entity count (AC-API-43)'}}
  /media/{key}:
    get:
      summary: Proxy an image/crop from the object store
      parameters: [{name: key, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: image bytes}, '404': {description: missing}}

  # ---- internal: perception reconciler ----
  /ingest/candidates:
    post:
      summary: Candidate entities for an observation (pgvector top-k on exemplar embeddings + zone/time context)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [embedding]
              properties:
                embedding: {type: array, items: {type: number}, minItems: 768, maxItems: 768}
                catalog_id: {type: [string, 'null']}
                location_id: {type: [string, 'null']}
                k: {type: integer, default: 10}
      responses: {'200': {description: candidates, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Candidate'}}}}}}
  /ingest/window:
    post:
      summary: Transactionally record one reconciled observation window (window + sightings + new entities + events + review items)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IngestWindow'}}}}
      responses: {'201': {description: recorded}, '422': {description: invalid payload}}

components:
  schemas:
    Item:
      type: object
      required: [entity_id, kind, status, label, confidence]
      properties:
        entity_id: {type: string, format: uuid}
        catalog_id: {type: [string, 'null']}
        catalog_name: {type: [string, 'null']}
        kind: {enum: [object, person]}
        status: {enum: [confirmed, provisional, unknown, merged, dismissed]}
        label: {type: string}
        description: {type: [string, 'null']}
        attributes: {type: object}
        last_location: {type: [string, 'null']}
        last_location_name: {type: [string, 'null']}
        last_seen_at: {type: [string, 'null'], format: date-time}
        first_seen_at: {type: [string, 'null'], format: date-time}
        confidence: {type: number}
        snapshot_url: {type: [string, 'null']}
        needs_review: {type: boolean}
        review_reason: {type: [string, 'null']}
        last_moved_by: {type: [string, 'null'], description: actor_desc of the latest 'moved' event}
        last_moved_at: {type: [string, 'null'], format: date-time}
        last_handled:
          description: latest moved/used/handed_over/added/removed/stowed/unstowed/consumed event, excluding operator 'added' (item creation)
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/LastHandled'}
        location_set_at: {type: [string, 'null'], format: date-time, description: when the current last_location was set (sighting time for the pipeline, edit time for an operator)}
        location_set_by: {type: [string, 'null'], description: "'pipeline' or the operator name"}
        merged_into:
          description: survivor of a merged item (AC-API-34); null unless status=merged
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MergedInto'}
        merged_at: {type: [string, 'null'], format: date-time, description: time of the merge (null unless status=merged, or for a legacy merge without audit)}
        merged_from:
          type: array
          description: items merged into this one, oldest merge first (AC-API-34)
          items: {$ref: '#/components/schemas/MergedFrom'}
        snapshot_bbox:
          description: '[x1,y1,x2,y2] normalised 0..1 of the object in snapshot_url when the snapshot is a whole frame; null for a crop or when unknown (AC-API-37)'
          oneOf:
            - {type: 'null'}
            - {type: array, items: {type: number, minimum: 0, maximum: 1}, minItems: 4, maxItems: 4}
        snapshot_bbox_source: {enum: [detector, omni, null], description: "'detector' = exact box, 'omni' = approximate box, null = unknown"}
        snapshot_withheld_reason: {enum: [private_window, null], description: "why snapshot_url is null: 'private_window' when the item was seen only in private windows (or, on review entities, its location is no_capture); null otherwise (AC-API-44)"}
    MergedInto:
      type: object
      required: [entity_id, label]
      properties:
        entity_id: {type: string, format: uuid}
        label: {type: string}
    MergedFrom:
      type: object
      required: [entity_id, label, merged_at]
      properties:
        entity_id: {type: string, format: uuid}
        label: {type: string}
        merged_at: {type: [string, 'null'], format: date-time}
    UnmergeResult:
      type: object
      required: [unmerged_entity_id, target_entity_id, source, target, restored]
      properties:
        unmerged_entity_id: {type: string, format: uuid}
        target_entity_id: {type: string, format: uuid}
        source: {$ref: '#/components/schemas/Item'}
        target: {$ref: '#/components/schemas/Item'}
        restored:
          type: object
          description: what was moved back (ids), plus the review reopened (review merge_into) and the target fields put back
          properties:
            sighting_ids: {type: array, items: {type: integer}}
            event_ids: {type: array, items: {type: string, format: uuid}}
            exemplar_ids: {type: array, items: {type: integer}}
            reinserted_exemplar_ids: {type: array, items: {type: integer}}
            actor_event_ids: {type: array, items: {type: string, format: uuid}}
            child_entity_ids: {type: array, items: {type: string, format: uuid}}
            review_ids: {type: array, items: {type: string, format: uuid}}
            candidate_review_ids: {type: array, items: {type: string, format: uuid}}
            reopened_review_id: {type: [string, 'null'], format: uuid}
            target_fields: {type: array, items: {type: string}}
    LastHandled:
      type: object
      required: [event_type, occurred_at]
      properties:
        event_type: {type: string}
        actor_desc: {type: [string, 'null']}
        occurred_at: {type: string, format: date-time}
    ReviewEntity:
      description: Item extended for review cards (AC-API-24); thumbnail_url/snapshot_url are null in no_capture locations
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required: [entity_id, label, status, confidence, thumbnail_url, sighting_count]
          properties:
            thumbnail_url: {type: [string, 'null']}
            sighting_count: {type: integer}
    ReviewCandidate:
      allOf:
        - $ref: '#/components/schemas/ReviewEntity'
        - type: object
          required: [similarity, score, match_reasons]
          properties:
            similarity: {type: [number, 'null'], description: max cosine similarity to the review entity's best exemplar; null when either has no exemplar}
            score: {type: [number, 'null'], description: 'ranking score (AC-API-35): appearance + description text + same zone/module + time proximity; higher = more likely the same item'}
            match_reasons:
              type: array
              description: why the candidate is suggested (AC-API-35)
              items: {enum: [similar appearance, similar description, same zone, same module, seen around the same time]}
    ItemPage:
      type: object
      required: [items, total]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Item'}}, total: {type: integer}}
    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          properties:
            sightings:
              type: array
              items:
                type: object
                properties:
                  bbox:
                    oneOf:
                      - {type: 'null'}
                      - {type: array, items: {type: number}, minItems: 4, maxItems: 4}
                  bbox_source: {enum: [detector, omni, null]}
                  person_overlap: {type: boolean, description: "the sighting's object crop overlapped a person and was not stored (AC-API-41)"}
                  is_private: {type: boolean, description: 'seen in a private window: no image by design (AC-API-44)'}
            events: {type: array, items: {$ref: '#/components/schemas/Event'}}
            exemplar_count: {type: integer}
    TimelineEntry:
      type: object
      required: [at, kind]
      properties:
        at: {type: string, format: date-time}
        kind: {enum: [sighting, event, audit]}
        location_id: {type: [string, 'null']}
        summary: {type: string}
        image_url: {type: [string, 'null']}
        count: {type: integer, description: audit entries only; >1 for a collapsed run of routine pipeline updates}
        first_at: {type: string, format: date-time, description: collapsed entries only; time of the oldest folded audit}
        audit_ids: {type: array, items: {type: string}, description: collapsed entries only; the folded audit ids}
        location_role: {enum: [at, from_to, null], description: event entries only (AC-API-38)}
        actor_kind: {enum: [operator, person, null], description: event entries only (AC-API-38)}
    Event:
      type: object
      properties:
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        entity_id: {type: string, format: uuid}
        actor_desc: {type: [string, 'null']}
        from_location: {type: [string, 'null']}
        to_location: {type: [string, 'null']}
        occurred_at: {type: string, format: date-time}
        confidence: {type: number}
        evidence_url: {type: [string, 'null']}
        source: {type: string}
        entity_label: {type: [string, 'null']}
        entity_catalog_id: {type: [string, 'null']}
        entity_kind: {enum: [object, person, null], description: "kind of the event's entity (AC-API-40); a person track has no entity_catalog_id"}
        from_location_name: {type: [string, 'null']}
        to_location_name: {type: [string, 'null']}
        entity_appearance: {type: [string, 'null'], description: "the person track's appearance text (its description); null for objects (AC-API-42)"}
        entity_last_location: {type: [string, 'null'], description: "the entity's current location (AC-API-42)"}
        entity_last_location_name: {type: [string, 'null']}
        location_source: {enum: [event, sighting, null], description: "'event' when the stored event names a place, 'sighting' when to_location was filled from the entity's sighting within 300 s of occurred_at, null without a place (AC-API-42)"}
        location_role: {enum: [at, from_to, null], description: "'from_to' for a move (moved, or from != to), 'at' when it happened in one place, null without location (AC-API-38)"}
        actor_kind: {enum: [operator, person, null], description: "'operator' when source=operator, 'person' otherwise, null when no actor is named (AC-API-38)"}
    ReviewItem:
      type: object
      required: [review_id, kind, image_url, description, observed_at, status]
      properties:
        review_id: {type: string, format: uuid}
        kind: {type: string}
        entity_id: {type: [string, 'null'], format: uuid}
        candidate_ids: {type: array, items: {type: string, format: uuid}}
        candidates: {type: array, items: {$ref: '#/components/schemas/ReviewCandidate'}, description: stored candidate_ids expanded, or (possible_duplicate with none stored) up to 8 server suggestions}
        candidates_source: {enum: [stored, suggested, none]}
        subject:
          description: the review's own entity
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/ReviewEntity'}
        image_url: {type: [string, 'null'], description: always set, except null for a legacy review stored in a no_capture location}
        image_bbox:
          description: '[x1,y1,x2,y2] normalised 0..1 of the object in image_url, from the sighting that produced the review; null if unknown (e.g. the image is already a crop)'
          oneOf:
            - {type: 'null'}
            - {type: array, items: {type: number, minimum: 0, maximum: 1}, minItems: 4, maxItems: 4}
        image_bbox_source: {enum: [detector, omni, null], description: "where image_bbox came from: 'detector' (exact), 'omni' (approximate), null (unknown/legacy or no box) (AC-API-37)"}
        description: {type: string}
        observed_at: {type: string, format: date-time}
        location_id: {type: [string, 'null']}
        model_guess: {type: [string, 'null']}
        probabilities: {type: object}
        status: {type: string}
    CatalogItem:
      type: object
      required: [catalog_id, class_name, display_name]
      properties:
        catalog_id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,63}$'}
        class_name: {type: string}
        display_name: {type: string}
        synonyms: {type: array, items: {type: string}}
        category: {enum: [object, person, container]}
        is_fungible: {type: boolean}
        expected_count: {type: [integer, 'null']}
        home_location: {type: [string, 'null']}
    Location:
      type: object
      properties: {location_id: {type: string}, parent_id: {type: [string, 'null']}, kind: {type: string}, display_name: {type: string}}
    Candidate:
      type: object
      properties:
        entity_id: {type: string, format: uuid}
        catalog_id: {type: [string, 'null']}
        label: {type: string}
        similarity: {type: number, description: max cosine similarity over exemplars}
        last_location: {type: [string, 'null']}
        last_seen_at: {type: [string, 'null'], format: date-time}
        status: {type: string}
    IngestWindow:
      type: object
      required: [window, assignments]
      properties:
        window:
          type: object
          required: [camera_id, t_start, t_end, model]
          properties:
            camera_id: {type: string}
            t_start: {type: string, format: date-time}
            t_end: {type: string, format: date-time}
            scene_summary: {type: [string, 'null'], description: 'null for a private window (AC-API-39 / AC-PER-43); the API stores null for a private window whatever is sent'}
            transcript: {type: [string, 'null'], description: 'null for a private window'}
            audio_events: {type: array, description: 'stored as an empty list for a private window'}
            model: {type: string}
            raw_uri: {type: [string, 'null']}
            private: {type: [boolean, 'null'], description: 'AC-API-39: true for a no_capture window. The API also treats the window as private when privacy.no_capture is true, the camera location is no_capture, or any sighting/event is in a no_capture location'}
            privacy_reason: {enum: [private_zone, sleep_cue, privacy_hold, null], description: coarse category only (never the cue text); any other value is stored as private_zone}
            privacy: {type: [object, 'null'], description: 'older perception metadata {no_capture, reason, field}; only no_capture/reason are read'}
        assignments:
          type: array
          items:
            type: object
            required: [sighting]
            properties:
              entity_id: {type: [string, 'null'], format: uuid, description: existing entity; null => create new_entity}
              new_entity:
                type: object
                properties: {catalog_id: {type: [string, 'null']}, kind: {type: string}, status: {type: string}, label: {type: string}, description: {type: string}, attributes: {type: object}}
              sighting:
                type: object
                required: [seen_at, confidence]
                properties: {location_id: {type: [string, 'null']}, seen_at: {type: string, format: date-time}, bbox: {type: [array, 'null']}, bbox_source: {enum: [detector, omni, null], description: 'optional (AC-API-37); ignored when bbox is null'}, confidence: {type: number}, frame_uri: {type: string}, description: {type: [string, 'null'], description: 'stored as null in a private window'}, person_boxes: {type: [array, 'null'], maxItems: 20, items: {type: array, items: {type: number, minimum: 0, maximum: 1}, minItems: 4, maxItems: 4}, description: "person regions of the sighting's frame (AC-API-41); a crop overlapping one is not stored"}, person_overlap: {type: [boolean, 'null'], description: 'perception dropped the crop because it overlapped a person (AC-API-41)'}, person_box_kinds: {type: [array, 'null'], items: {enum: [person, face]}, description: 'one per person box; a face box uses the whole box as its head zone'}}
              exemplar: {type: [object, 'null'], properties: {embedding: {type: array, items: {type: number}}, quality: {type: number}, crop_uri: {type: string}}}
              ref: {type: string, description: local ref so events/reviews in the same payload can point at new entities}
        events:
          type: array
          items:
            type: object
            properties: {event_type: {type: string}, entity_ref: {type: string}, entity_id: {type: [string, 'null']}, actor_desc: {type: [string, 'null']}, from_location: {type: [string, 'null']}, to_location: {type: [string, 'null']}, occurred_at: {type: string}, confidence: {type: number}, evidence_uri: {type: [string, 'null']}, source: {type: string}}
        reviews:
          type: array
          items:
            type: object
            properties: {kind: {type: string}, entity_ref: {type: string}, entity_id: {type: [string, 'null']}, candidate_ids: {type: array}, image_uri: {type: string}, description: {type: string}, observed_at: {type: string}, location_id: {type: [string, 'null']}, model_guess: {type: [string, 'null']}, probabilities: {type: object}}
        decisions:
          type: array
          items: {type: object, properties: {question: {type: string}, subject: {type: object}, choice: {type: string}, probabilities: {type: object}, model: {type: string}, latency_ms: {type: integer}}}
        stock_updates:
          type: array
          description: fungible items — upsert (catalog_id, location_id) with est_count and last_seen_at (newer wins)
          items: {type: object, required: [catalog_id, location_id, est_count, seen_at], properties: {catalog_id: {type: string}, location_id: {type: string}, est_count: {type: integer, minimum: 0}, seen_at: {type: string, format: date-time}}}
  /stock:
    get:
      summary: Fungible stock counts per zone
      parameters: [{name: catalog_id, in: query, schema: {type: string}}, {name: location, in: query, schema: {type: string}}]
      responses: {'200': {description: rows}}
