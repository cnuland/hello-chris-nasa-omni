# Inventory database (source of truth). The CNPG "standard" image bundles pgvector.
# Credentials are generated by CNPG into the Secret inventory-db-app (never committed).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: inventory-db, namespace: nasa-data}
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16-standard-bookworm
  storage: {size: 20Gi}
  bootstrap:
    initdb:
      database: inventory
      owner: inventory
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
  postgresql:
    parameters: {shared_buffers: 512MB, max_connections: "200"}
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}
