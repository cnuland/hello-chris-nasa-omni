[project]
name = "nasa-agent"
version = "0.1.0"
description = "NASA Omni agent - grounded tool-calling chatbot, inventory-first memory (dreaming) and MCP server"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "psycopg[binary,pool]>=3.2",
    "sse-starlette>=2.1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.scripts]
nasa-agent-dream = "nasa_agent.dreaming:main"
nasa-agent-mcp = "mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nasa_agent"]
py-modules = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not model'"
markers = [
    "model: needs real model weights or a live LLM (skipped by default)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
