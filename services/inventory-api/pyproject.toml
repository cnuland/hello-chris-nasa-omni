[project]
name = "inventory-api"
version = "0.1.0"
description = "NASA Omni Inventory API - the only writer to Postgres (contracts/openapi/inventory-api.yaml)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "moto[s3]>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["inventory_api", "inventory_api.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not model'"
markers = [
    "model: needs real model weights (skipped by default)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
