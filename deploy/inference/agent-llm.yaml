            else:
                print("WARNING: sampler patch anchor not found")
            PY
            exec vllm serve "$@"
          - vllm-serve
          args: ["openai/whisper-large-v3-turbo", "--served-model-name", "asr", "--host", "0.0.0.0", "--port", "8000", "--dtype", "half", "--gpu-memory-utilization", "0.85", "--max-num-seqs", "4"]
          env:
            - {name: HOME, value: /cache}
            - {name: HF_HOME, value: /cache/hf}
            - {name: CUDA_MODULE_LOADING, value: EAGER}
