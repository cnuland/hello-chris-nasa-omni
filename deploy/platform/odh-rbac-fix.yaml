# ODH 3.3.0's CSV omits read access to the cluster APIServer config, which the operator needs at start-up to load the
# TLS profile ("apiservers.config.openshift.io \"cluster\" is forbidden" -> CrashLoopBackOff). Read-only, narrow.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: odh-operator-read-apiserver-config}
rules:
  - {apiGroups: [config.openshift.io], resources: [apiservers], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: odh-operator-read-apiserver-config}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: odh-operator-read-apiserver-config}
subjects: [{kind: ServiceAccount, name: opendatahub-operator-controller-manager, namespace: openshift-operators}]
