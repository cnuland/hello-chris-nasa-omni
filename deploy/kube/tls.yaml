# TLS front door: the only port published to the outside world on a POC host.
#
#   podman kube play --network nasa deploy/kube/tls.yaml
#
# Kept out of app.yaml so the application tier plays unchanged on a laptop, where there is no certificate and
# port 443 is not wanted. nginx terminates TLS and proxies to the dashboard pod over the `nasa` network.
# The certificate is a podman secret (`nasa-tls`, keys tls.crt / tls.key) created by scripts/install-app.sh,
# not a host path, so the private key stays in podman's secret store.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nasa-tls-proxy
  labels: {tier: app}
data:
  default.conf: |
    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        server_tokens off;
        client_max_body_size 25m;

        # nginx resolves this name once, at start-up. Replaying app.yaml gives the dashboard pod a new address,
        # so scripts/install-app.sh always replays tls.yaml after it; `podman pod restart tls` does the same by hand.
        location / {
            proxy_pass http://dashboard:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_buffering off;              # chat answers stream as server-sent events
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: tls
  labels: {app: tls, tier: app}
spec:
  restartPolicy: Always
  containers:
    - name: nginx
      image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
      ports: [{containerPort: 8443, hostPort: 443}]
      volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d, readOnly: true}
        - {name: certs, mountPath: /etc/nginx/certs, readOnly: true}
      livenessProbe:
        exec: {command: ["wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/"]}
        initialDelaySeconds: 10
        periodSeconds: 30
        failureThreshold: 3
  volumes:
    - {name: conf, configMap: {name: nasa-tls-proxy}}
    - {name: certs, secret: {secretName: nasa-tls}}
