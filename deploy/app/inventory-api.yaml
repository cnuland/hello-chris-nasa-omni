# Inventory Management System API (FastAPI). It runs migrations on start (idempotent) and owns all writes to Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: nasa-app
  labels: {app: inventory-api}
  annotations: {image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"inventory-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image"}]'}
spec:
  replicas: 2
  selector: {matchLabels: {app: inventory-api}}
  template:
    metadata: {labels: {app: inventory-api}}
    spec:
      containers:
        - name: api
          image: inventory-api:latest
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: inventory-db-app, key: uri}}}
            - {name: S3_ENDPOINT, value: "http://rustfs.nasa-data.svc:9000"}
            - {name: S3_BUCKET, value: inventory}
            - {name: S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: rustfs-creds, key: access-key}}}
            - {name: S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: rustfs-creds, key: secret-key}}}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 30, failureThreshold: 5}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: inventory-api, namespace: nasa-app}
spec: {selector: {app: inventory-api}, ports: [{name: http, port: 8080}]}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: inventory-api, namespace: nasa-app}
spec: {to: {kind: Service, name: inventory-api}, port: {targetPort: http}, tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}}
